name: Publish Python package to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version in pyproject.toml to publish (for example, 0.1.11)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine
      - name: Verify release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - "$EVENT_NAME" "$REF_NAME" "$INPUT_VERSION" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          event_name, ref_name, input_version = sys.argv[1:]
          project_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]

          if event_name == "push":
              expected_tag = f"v{project_version}"
              if ref_name != expected_tag:
                  raise SystemExit(
                      f"Tag {ref_name!r} does not match project version "
                      f"{project_version!r}; expected {expected_tag!r}."
                  )
          elif input_version != project_version:
              raise SystemExit(
                  f"Manual release requested for {input_version!r}, but "
                  f"pyproject.toml contains {project_version!r}."
              )
          PY
      - name: Build package
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          smoke_venv="${RUNNER_TEMP}/sph-client-smoke"
          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install dist/*.whl
          "$smoke_venv/bin/python" -c \
            "from importlib.metadata import version; import sph_client; assert sph_client.__version__ == version('sph-client')"
      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
