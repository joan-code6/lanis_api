[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sph-client"
version = "0.1.11"
description = "Python API client for Schulportal Hessen (SPH)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Schulportal Hessen API Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "python-dotenv>=1.0.0",
    "pycryptodomex>=3.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/joan-code6/lanis_api"
Repository = "https://github.com/joan-code6/lanis_api"
Issues = "https://github.com/joan-code6/lanis_api/issues"

[tool.setuptools.packages.find]
include = ["sph_client", "schulportal_hessen", "schulportal_hessen.*"]

[tool.ruff]
target-version = "py310"
