[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sph-client"
version = "0.1.10"
description = "Python API client for Schulportal Hessen (SPH)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Schulportal Hessen API Contributors"}
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pycryptodome>=3.19.0",
]

[project.scripts]
lanis-mcp = "lanis_mcp.server:main"

[project.optional-dependencies]
mcp = [
    "httpx>=0.27.0",
    "mcp>=1.27,<2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["api*", "lanis_mcp*", "schulportal_hessen*", "sph_client*"]
exclude = ["docs*", "scripts*", "skills*", "tests*", "tui*"]

[tool.ruff]
target-version = "py310"
